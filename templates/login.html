{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="auth-wrap container py-5">
  <div class="auth-card">
    <div class="auth-heading"><span class="auth-icon"><i class="bi bi-box-arrow-in-right"></i></span><span class="eyebrow">Welcome back</span><h1 class="h2 mt-2">Sign in to MealBridge</h1><p class="text-secondary">Pick up where your community left off.</p></div>
    <form method="post" novalidate>
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control form-control-lg" id="email" name="email" type="email" autocomplete="email" value="{{ request.form.get('email', '') }}" required></div>
      <div class="mb-4"><label class="form-label" for="password">Password</label><input class="form-control form-control-lg" id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-success btn-lg w-100" type="submit">Sign in <i class="bi bi-arrow-right ms-1"></i></button>
    </form>
    <p class="text-center text-secondary mt-4 mb-0">New to MealBridge? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </div>
</section>
{% endblock %}
